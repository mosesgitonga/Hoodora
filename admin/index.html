<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- nginx replaces this with a fresh nonce per request, the same one it puts in
         the Content-Security-Policy header; Ant Design tags its styles with it
         (decision D.5). In development it stays as it is, and no CSP applies. -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hoodora admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
