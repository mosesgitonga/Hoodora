# nginx site for the public website, hoodora.one, on the shared VPS:
# /etc/nginx/sites-available/hoodora.one
#
# Static files only, from /srv/hoodora-website (a copy of website/ in the
# repository, made by deploy.sh on every deploy once that folder exists).
# certbot (`certbot --nginx -d hoodora.one -d www.hoodora.one`) then adds the
# TLS lines and the HTTP-to-HTTPS redirect to this file on the server.
#
# For search engines, the site has one address: https://hoodora.one/. www is
# redirected to it permanently, as the page's canonical link says.

server {
    listen 80;
    listen [::]:80;
    server_name www.hoodora.one;
    return 301 https://hoodora.one$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hoodora.one;

    root /srv/hoodora-website;
    index index.html;
    charset utf-8;

    # The page has no scripts at all (its JSON-LD is data, which CSP leaves
    # alone), and its styles are inline.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;

    # Pages: always checked, so an edit shows at once.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Images can be swapped under the same name (see website/README.md): a week.
    location /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # Same origin, so no CORS header: an add_header here would also drop the
    # security headers above, which nginx only inherits into a location with none.
    location /fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log off;
}
