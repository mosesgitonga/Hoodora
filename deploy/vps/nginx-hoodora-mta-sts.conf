# nginx site for MTA-STS, mta-sts.hoodora.one, on the shared VPS:
# /etc/nginx/sites-available/mta-sts.hoodora.one
#
# Mail servers sending to @hoodora.one fetch this policy over HTTPS and then
# deliver only over verified TLS to Zoho's MX hosts (RFC 8461). The policy is
# deploy/vps/mta-sts.txt, as Zoho made it, copied by hand to
# /srv/hoodora-mta-sts/.well-known/mta-sts.txt. certbot
# (`certbot --nginx -d mta-sts.hoodora.one`) then adds the TLS lines here.
#
# Changing the policy: edit the file, copy it to the server, and change the id
# in the `_mta-sts.hoodora.one` TXT record. Senders keep the policy they have
# until the id changes or max_age runs out.

server {
    listen 80;
    listen [::]:80;
    server_name mta-sts.hoodora.one;

    root /srv/hoodora-mta-sts;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        types { }
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    access_log off;
}
