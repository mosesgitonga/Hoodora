# nginx site for Hoodora on the shared VPS: /etc/nginx/sites-available/myradius.chatara.co
#
# Installed by deploy/vps/bootstrap.sh. certbot (`certbot --nginx -d myradius.chatara.co`)
# then adds the TLS lines and the HTTP-to-HTTPS redirect to this file on the server.
#
#   /                   the API (127.0.0.1:8031), including the /v1/ws WebSocket
#   /v1/admin/          the same API, behind the admin IP allowlist (decision D.6),
#                       which allows everyone unless its snippet says otherwise
#   /myradius-media/    object storage (127.0.0.1:8032), for presigned uploads and
#                       downloads. The Host header is passed through unchanged:
#                       it is part of each URL's signature.
#   /cdn-origin/        the media CDN's origin (decision U.2): processed variants
#                       only, from the storage filer (127.0.0.1:8033), and only for
#                       requests carrying the pull zone's secret header.
#
# The secret lives outside the repository, in a root-only snippet included in the
# origin's location (bootstrap.sh writes it from CDN_ORIGIN_SECRET):
#
#   if ($http_x_hoodora_cdn != "<secret>") { return 403; }
#
# Not a `map`: a 64-character key overflows nginx's default map_hash_bucket_size,
# and raising that is server-wide, which would touch the other projects' sites.

map $http_upgrade $myradius_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name myradius.chatara.co;

    # The API accepts small JSON bodies only; photos go to storage below.
    client_max_body_size 1m;

    # Scraped on the internal network only, never through the front door.
    location = /metrics {
        return 404;
    }

    location /myradius-media/ {
        # Photos: the API's own limit is lower; this only has to let them through.
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # The CDN's origin. Only a variant's exact key shape (`public/<purpose>/<owner>/
    # <random>.webp`): never an original, never a directory listing. Only with the
    # pull zone's secret header, so nobody can fetch around the CDN's tokens.
    location ~ "^/cdn-origin/(public/[a-z_]+/[0-9a-f-]{36}/[0-9a-f]{32}\.webp)$" {
        include /etc/nginx/snippets/myradius-cdn-origin.conf;
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8033/buckets/myradius-media/$1;
        proxy_http_version 1.1;
        proxy_set_header X-Hoodora-Cdn "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    location /cdn-origin/ {
        return 404;
    }

    # The admin API: the same as below, plus the allowlist the dashboard's own site
    # uses (/etc/nginx/snippets/myradius-admin-allow.conf, decision D.6).
    location /v1/admin/ {
        include /etc/nginx/snippets/myradius-admin-allow.conf;
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API takes the leftmost entry as the client,
        # so nothing a client sends may survive in front of it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $myradius_connection_upgrade;
        proxy_read_timeout 120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # No access log: the API logs each request itself, redacted, without the
    # query string. nginx's default would keep tokens and presigned signatures.
    access_log off;
}
