# nginx site for the admin dashboard on the shared VPS (decision D.6):
# /etc/nginx/sites-available/myradius-admin.chatara.co
#
# Installed by deploy/vps/bootstrap.sh. certbot (`certbot --nginx -d
# myradius-admin.chatara.co`) then adds the TLS lines and the HTTP-to-HTTPS
# redirect to this file on the server.
#
# Static files only, from /srv/myradius-admin/current: a symlink deploy.sh moves
# to each new build once the API is live. The dashboard calls the API on its own
# origin (myradius.chatara.co), which allows this origin on /v1/admin only.
#
# The Content-Security-Policy allows scripts and styles from this origin only,
# plus, for styles, a nonce: Ant Design writes its styles into the page at
# runtime, and tags them with the nonce it finds in index.html (decision D.5).
# The nonce is $request_id, fresh for every response, and the same value goes
# into the header and the page, so index.html is never cached.

server {
    listen 80;
    listen [::]:80;
    server_name myradius-admin.chatara.co;

    root /srv/myradius-admin/current;
    index index.html;

    # Who may reach the dashboard at all (decision D.6). Allows everyone unless
    # the snippet says otherwise; see docs/DEPLOYMENT.md to restrict it.
    include /etc/nginx/snippets/myradius-admin-allow.conf;

    # Every response, including errors. Headers here apply because no location
    # below sets add_header of its own.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' https://myradius.chatara.co https://media.myradius.chatara.co; connect-src https://myradius.chatara.co; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The page: the nonce goes in, and it is never cached.
    location = /index.html {
        sub_filter "__CSP_NONCE__" "$request_id";
        sub_filter_once off;
        sub_filter_types text/html;
        expires -1;
    }

    # Built files carry a content hash in their names, so they can be kept.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Every other address is a screen of the app.
    location / {
        try_files $uri /index.html;
    }

    # The dashboard sends no secrets in its addresses, but the API's own
    # policy is no access log, and there is nothing here worth keeping one for.
    access_log off;
}
